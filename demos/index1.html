    } from '../packages/reactivity/dist/reactivity.js'

    const state = reactive({
      name: 'zhangsan',
      age: 11,
      address: {
        country: '中国',
        number: '123456',
      },
    })
    const info = document.getElementById('info')
    const template = (name, age) => `name: ${name}, age: ${age}`

    // 深度代理

    // setTimeout(() => {
    //   state.address.number = '654321'
    // }, 1000)

    // 实现ref
    const flag = ref(false)
    /**
     * flag = {
     *  _v: false,
     *  get value() {
     *    return this._v;
     *  },
     *  set value(newVal) {
     *    this._v = newVal;
     *  }
     * }
     */
    effect(() => {
      info.textContent = flag.value ? 'yes' : 'no'
    })
    setTimeout(() => {
      flag.value = true
    }, 1000)

    // 实现toRef
    // const name = toRef(state, 'name')
    /**
     * 当访问name.value的时候，实际访问的是state.name
     */
    // console.log(name.value)

    // 实现toRefs
    const { name, age } = toRefs(state)
    console.log(name, age)

    // 实现proxyRefs,方便在template模板中直接取值，不用再加上.value
    const proxy = proxyRefs({ ...toRefs(state), a: 10023 })
    proxy.age = 1123
    console.log(proxy.name, proxy.age) // 访问proxy.name --> 实际上访问proxy.name.value
